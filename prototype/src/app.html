<!-- app.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicons/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Fonts -->
    <style>
      @font-face {
        font-family: 'Source Sans Pro Web';
        font-style: normal;
        font-weight: 300;
        font-display: optional;
        src: url('%sveltekit.assets%/uswds/fonts/source-sans-pro/sourcesanspro-light-webfont.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Source Sans Pro Web';
        font-style: normal;
        font-weight: 400;
        font-display: optional;
        src: url('%sveltekit.assets%/uswds/fonts/source-sans-pro/sourcesanspro-regular-webfont.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Source Sans Pro Web';
        font-style: normal;
        font-weight: 700;
        font-display: optional;
        src: url('%sveltekit.assets%/uswds/fonts/source-sans-pro/sourcesanspro-bold-webfont.woff2') format('woff2');
      }
    </style>

    <script>/* Copy into each variant's app.html head, replacing i13-open-house. Runs before paint. */
(function () {
  var key = 'fedramp-design-concepts:i8:i13-open-house:theme';
  var valid = function (value) { return ['light', 'dark', 'system'].includes(value); };
  var preference = 'system';
  try { var stored = localStorage.getItem(key); if (valid(stored)) preference = stored; } catch (_) {}
  var url = new URL(location.href);
  var requested = url.searchParams.get('theme');
  if (valid(requested)) { preference = requested; try { localStorage.setItem(key, preference); } catch (_) {} }
  var media = matchMedia('(prefers-color-scheme: dark)');
  function apply() {
    document.documentElement.dataset.theme = preference === 'system' ? (media.matches ? 'dark' : 'light') : preference;
    document.documentElement.dataset.themePreference = preference;
  }
  window.fedrampTheme = {
    get: function () { return preference; },
    set: function (value) {
      if (!valid(value)) return;
      preference = value;
      try { localStorage.setItem(key, value); } catch (_) {}
      var current = new URL(location.href);
      if (current.searchParams.has('theme')) { current.searchParams.delete('theme'); history.replaceState(history.state, '', current); }
      apply();
    }
  };
  media.addEventListener('change', function () { if (preference === 'system') apply(); });
  apply();
})();
</script>
<style>@font-face{font-family:'Public I7';font-weight:400;src:url('%sveltekit.assets%/uswds/fonts/public-sans/PublicSans-Regular.woff2')}@font-face{font-family:'Public I7';font-weight:700 800;src:url('%sveltekit.assets%/uswds/fonts/public-sans/PublicSans-Bold.woff2')}@font-face{font-family:'Public I7';font-weight:900;src:url('%sveltekit.assets%/uswds/fonts/public-sans/PublicSans-Black.woff2')}@font-face{font-family:'Merri I7';font-weight:400;src:url('%sveltekit.assets%/uswds/fonts/merriweather/Latin-Merriweather-Regular.woff2')}@font-face{font-family:'Merri I7';font-weight:700 900;src:url('%sveltekit.assets%/uswds/fonts/merriweather/Latin-Merriweather-Bold.woff2')}@font-face{font-family:'Merri I7';font-weight:400 900;font-style:italic;src:url('%sveltekit.assets%/uswds/fonts/merriweather/Latin-Merriweather-BoldItalic.woff2')}</style>
%sveltekit.head%
  <style>.i11.i10 .agency-decision{padding-bottom:50px}.i11.i10 .assurance{padding-top:50px}</style></head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
